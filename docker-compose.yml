services:
  erddap:
    # Pinned, not :latest -- this is a public-facing box; image changes
    # should be a deliberate version bump + review, not something that
    # silently lands on the next `docker compose pull`. v2.30.0 is what
    # was actually verified working end-to-end (see design-notes.md).
    image: axiom/docker-erddap:v2.30.0
    container_name: erddap
    restart: unless-stopped
    # Hard memory cap. Without this, the JVM sizes its heap off the HOST's
    # full RAM (confirmed in logs: Xmx ~= 3025 MB on this ~3.8GB box before
    # this limit existed) -- almost nothing left for the OS/Caddy/Docker
    # itself, so one heavy public request risked the OOM killer taking down
    # the whole instance, not just this container. With the limit set, the
    # JVM (cgroup-aware) sizes ERDDAP_MAX_RAM_PERCENTAGE off THIS number
    # instead of the host total.
    deploy:
      resources:
        limits:
          memory: 2500M
    environment:
      # Heap sized as a % of the container's memory limit above (~2GB),
      # not the host total.
      ERDDAP_MAX_RAM_PERCENTAGE: "80"
      ERDDAP_bigParentDirectory: /erddapData/
      # Placeholder until a real domain is pointed at this server -- see
      # the Caddyfile note. Update both together once DNS exists.
      ERDDAP_baseUrl: http://158.39.77.95
      # Datasets removed from datasets.d get flagged inactive automatically
      # instead of erroring on next reload.
      DATASETSD_MARK_REMOVED_DATASETS_INACTIVE: "1"
    volumes:
      # BIND MOUNTS to explicit host paths under /data -- deliberately not
      # bare named volumes. /data is meant to be the mount point of a
      # separate Cinder block volume (see design-notes.md), so growing that
      # volume later requires zero changes here: the host path stays the
      # same, only what's backing it changes. Using named volumes instead
      # would put this data under /var/lib/docker on the 20GB root disk by
      # default -- exactly the trap this setup avoids.
      #
      # Deliberately NOT mounting /usr/local/tomcat/content/erddap here.
      # That directory ships a default setup.xml baked into the image;
      # bind-mounting a host directory over it replaces the directory's
      # entire contents (not merges into them), which hides that default
      # and breaks startup (confirmed: NoSuchFileException on setup.xml).
      # Axiom's own docs say this directly -- "When using datasets.d mode
      # it is not necessary to mount the ERDDAP content directory at all."
      # All setup.xml values we need (baseUrl, bigParentDirectory) are
      # covered by the ERDDAP_* env vars below instead, which override the
      # image's baked-in defaults without needing our own file.
      - /data/erddap/erddapData:/erddapData
      - /data/erddap/datasets.d:/datasets.d:ro
      - /data/ogdp/processed:/data/ogdp/processed:ro
    expose:
      - "8080"
    networks:
      - erddap_net

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's own state (certs, small metadata) -- not science data, so
      # ordinary named volumes are fine here, unlike the erddap service above.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - erddap
    networks:
      - erddap_net

networks:
  erddap_net:

volumes:
  caddy_data:
  caddy_config:
